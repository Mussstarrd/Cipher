name: Unity

# Compiles game/ in the real editor and produces a playable Windows build as a
# CI artifact (hard rule 6: releases are tagged CI artifacts only).
#
# Requires three repo secrets (see game/README.md "CI license"):
#   UNITY_LICENSE  — contents of the Unity_v6000.x.ulf file
#   UNITY_EMAIL    — Unity ID email
#   UNITY_PASSWORD — Unity ID password
# Until they exist the build job is skipped (not failed) so the branch stays green.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: License secrets present?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          echo "ready=$HAS_LICENSE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::warning::UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD not set — Unity build skipped."
          fi

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic versioning reads tag history

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: game/Library
          key: unity-library-${{ matrix.targetPlatform }}-${{ hashFiles('game/Packages/packages-lock.json', 'game/ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ matrix.targetPlatform }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: CipherDeadTurf
          versioning: Semantic
          allowDirtyBuild: true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CipherDeadTurf-${{ matrix.targetPlatform }}-${{ github.sha }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
