name: Unity

# Compiles game/ in the real editor and produces a playable Windows build as a
# CI artifact (hard rule 6: releases are tagged CI artifacts only).
#
# Licensing: Unity removed manual (.alf/.ulf) activation for Personal seats, so the
# classic game-ci UNITY_LICENSE route is dead. We use the buildalon actions, which
# activate a Personal license through the Unity Licensing Client with just:
#   UNITY_USERNAME - Unity ID email
#   UNITY_PASSWORD - Unity ID password
# Until those repo secrets exist the build job is skipped (not failed).
# See game/README.md "CI license".

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      android:
        description: "Also build an Android APK (slow: IL2CPP + shader variants)"
        type: boolean
        default: false

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: License secrets present?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_LICENSE: ${{ secrets.UNITY_USERNAME != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          echo "ready=$HAS_LICENSE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::warning::UNITY_USERNAME / UNITY_PASSWORD not set - Unity build skipped."
          fi

  build:
    name: Build ${{ matrix.build-target }}
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-target: StandaloneWindows64
    steps:
      - uses: actions/checkout@v5

      - name: Install Unity (version from ProjectVersion.txt)
        uses: buildalon/unity-setup@v2
        id: unity-setup
        with:
          version-file: game/ProjectSettings/ProjectVersion.txt
          build-targets: ${{ matrix.build-target }}
          cache-installation: false # cached editor restore crashed Unity with 0x8007007E (missing DLL) on 2026-09-10

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: game/Library
          key: unity-library-${{ matrix.build-target }}-${{ hashFiles('game/Packages/packages-lock.json', 'game/ProjectSettings/**') }}
          restore-keys: |
            unity-library-${{ matrix.build-target }}-

      - name: EditMode tests
        uses: buildalon/unity-action@v3
        with:
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: ${{ github.workspace }}/game
          build-target: ${{ matrix.build-target }}
          log-name: Tests-EditMode
          args: -batchmode -nographics -runTests -testPlatform EditMode -testResults "${{ github.workspace }}/TestResults/EditMode.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-EditMode-${{ github.sha }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

      - name: Build player
        uses: buildalon/unity-action@v3
        with:
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: ${{ github.workspace }}/game
          build-target: ${{ matrix.build-target }}
          log-name: Build-${{ matrix.build-target }}
          args: -quit -batchmode -nographics -executeMethod Cipher.Game.Editor.CiBuild.BuildWindows -buildPath "${{ github.workspace }}/Builds/${{ matrix.build-target }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectExodus-${{ matrix.build-target }}-${{ github.sha }}
          path: Builds/${{ matrix.build-target }}
          # A player build is ~90 MB and GitHub's free artifact allowance is 500 MB total, so
          # storage bills long before Actions minutes do. Three days is enough to pull a build
          # down; tagged releases get kept deliberately, not by accident.
          retention-days: 3
          if-no-files-found: error

  # Android is opt-in: IL2CPP plus the Standard shader's variant explosion makes it a long build,
  # and it ran the owner's 16 GB laptop out of memory locally. The APK is built here and downloaded
  # straight onto the phone from the run's artifact list. Trigger from the Actions tab:
  # "Run workflow" with Android ticked.
  #
  # Windows runner, despite billing at 2x Actions minutes: ubuntu-latest cannot install Unity Hub
  # (buildalon/unity-setup aborts on a missing /opt/unityhub/unityhub after the .deb postinst fails
  # for want of update-desktop-database). Revisit if that action gains a working Linux path.
  android:
    name: Build Android APK
    needs: gate
    if: needs.gate.outputs.ready == 'true' && inputs.android
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Unity with Android support
        uses: buildalon/unity-setup@v2
        id: unity-setup
        with:
          version-file: game/ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: false

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build APK
        uses: buildalon/unity-action@v3
        with:
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: ${{ github.workspace }}/game
          build-target: Android
          log-name: Build-Android
          args: -quit -batchmode -nographics -executeMethod Cipher.Game.Editor.CiBuild.BuildAndroid -buildPath "${{ github.workspace }}/Builds/Android"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectExodus-Android-${{ github.sha }}
          path: Builds/Android/*.apk
          retention-days: 7
          if-no-files-found: error
