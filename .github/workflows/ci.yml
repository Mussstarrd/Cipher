name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sim:
    name: Sim core — build, test, bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build (warnings are errors)
        run: dotnet build sim/tests/Cipher.Sim.Tests/Cipher.Sim.Tests.csproj -c Release

      - name: Test
        run: dotnet test sim/tests/Cipher.Sim.Tests/Cipher.Sim.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Bench smoke
        run: dotnet run --project sim/tools/Cipher.Sim.Bench/Cipher.Sim.Bench.csproj -c Release -- --smoke
