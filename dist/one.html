<style>
  :root {
    color-scheme: dark;

  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 72px; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

  .roll-id { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .roll {
    appearance: none; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
    font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: 0.08em; padding: 18px; cursor: pointer; width: 100%;

  .roll:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .roll:active { transform: scale(0.99); }

  .vibe { font-size: 15px; line-height: 1.45; color: var(--text); margin: 0; }
  .vibe em { font-style: normal; color: var(--accent); }

  .field { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .field-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
  .field-name { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .count { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .copy {
    appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 999px;
    padding: 6px 14px; font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .box {
    margin: 10px; background: var(--field); border-radius: 10px; padding: 12px 14px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  .sliders { padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .slider { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 12px; font-size: 13px; }
  .track { height: 6px; border-radius: 3px; background: var(--field); position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  .knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--text); }
  .val { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; }

<script>
/* ONE OF ONE — guard rails learned from listening tests. Every word here
 * sent a real Suno take somewhere the artist did not want it to go. */
"use strict";

const OneGuard = (() => {
  const RULES = [
    {
      name: "film score / world / folk / lo-fi",
      why: "turned beats into film-score background music or low-fidelity sound design",
      re: /\b(koto|sitar|tabla|bagpipe\w*|accordion|harpsichord|flamenco|steel[- ]?(pan|drum)|banjo|whistl\w*|pan flute|ocarina|duduk|cello\w*|viola|violin|pizzicato|harps?|bowed|timpani|cathedral|church|pipe[- ]organ|orchestral(?! brass)|cinematic|film|horror|haunt\w*|eerie|ghostly|spaghetti|western|mellotron|woodwind|cassette|vinyl|crackl\w*|transistor|sewer|storm drain|basement|boiler|tunnel|subway|overpass|dripping|manhole|dumpster|nylon|slide[- ]guitar|upright|double bass|fanfare|marimba|kalimba|music box|glockenspiel|celesta|xylophone)\b/i,
    },
    {
      name: "meter",
      why: "made Suno play oom-pah carnival music",
      re: /\b(waltz\w*|lilt\w*|limp\w*|oompah|oom-pah|carnival|circus|polka|calliope)\b|\b(3|5|6|7|9|12)\/(4|8)\b/i,
    },
    {
      name: "voice",
      why: "invites gibberish background voices into an instrumental",
      re: /\b(vocal|vocals|vocalist|rap\b|rapper|sing|sings|singing|singer|sung|chant\w*|choir|hum|humming|hummed|lyric\w*|ad-?lib\w*|falsetto|harmonies)\b/i,
    },
    {
      name: "DJ / transition effects",
      why: "produced phaser sweeps, risers and scratches every few bars",
      re: /\b(transition\w*|sweeps?|risers?|phaser|dj\b|scratch\w*|fills?|cowbell|rim ?shots?|airhorn)\b/i,
    },
    {
      name: "off-format genre",
      why: "pulls the beat out of hip hop",
      re: /\b(edm|dubstep|jazz\w*|funk\w*|disco|house\b|polka|country|bluegrass)\b/i,
    },
    {
      name: "EDM / voice / lo-fi trigger",
      why: "research: these words pull in EDM drops, crowd voices or lo-fi hiss",
      re: /\b(drops?|build-?ups?|sidechain\w*|wobble|growl|reese|tape|tape-\w+|chop\w*|stutter edit|beat repeat|dusty|lo-?fi|chill|retro|vintage|soulful|ambient|atmospheric|ethereal|epic|anthem\w*|festival|gospel|arena|crowd|singalong|memphis|phonk|voices?|bells?|strings|string section|pads?|glitch)\b/i,
    },
    {
      name: "negation",
      why: "\"no X\" plants X",
      re: /\bno\s+\w+/i,
    },
  ];

  // Reference names live in the UI only. Suno strips or rewrites them, and
  // a wrong name in a prompt can drag in the wrong artist's sound.
  const NAMES = [
    "jid", "j.i.d", "big sean", "sean don", "lil wayne", "weezy", "wayne", "j. cole", "j cole", "jcole", "cole",
    "prof", "gampo", "connor price", "drake", "drizzy", "kendrick", "travis scott", "future", "metro boomin",
    "a milli", "blessings", "mcafee", "bruddanem", "glory", "lil durk", "durk", "bangladesh", "vinylz",
    "boi-1da", "lex luger", "dj khalil", "timbaland", "pi'erre bourne", "kenny beats", "tay keith", "mannie fresh",
    "three 6 mafia", "dj paul", "cardo", "dreamville",
  ];
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const NAME_RE = new RegExp(`(^|[^a-z0-9])(${NAMES.map(esc).join("|")})($|[^a-z0-9])`, "i");

  function check(text) {
    const hits = [];
    for (const r of RULES) {
      const m = text.match(r.re);
      if (m) hits.push({ rule: r.name, word: m[0].trim(), why: r.why });
    }
    const n = text.match(NAME_RE);
    if (n) hits.push({ rule: "reference name", word: n[2], why: "names never go in the prompt" });
    return hits;
  }

  return { RULES, NAMES, check };
})();


/* ONE OF ONE — keys and chord loops. Minor-heavy, hip hop canon only. */
"use strict";

const OneTheory = (() => {
  const SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
  const PC = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };
  const SHARP_KEYS = { minor: new Set(["E", "B", "F#", "C#", "G#", "D#", "A#"]), major: new Set(["G", "D", "A", "E", "B", "F#"]) };
  const MINOR_KEYS = SHARP.slice();
  const MAJOR_KEYS = FLAT.slice();

  // [semitones above tonic, suffix]. Short loops; the riff does the talking.
  const LOOPS = [
    { tonality: "minor", roman: "i – ♭VI", chords: [[0, "m"], [8, ""]] },
    { tonality: "minor", roman: "i – ♭II", chords: [[0, "m"], [1, ""]] },
    { tonality: "minor", roman: "i (pedal)", chords: [[0, "m"]] },
    { tonality: "minor", roman: "i – ♭VI – V", chords: [[0, "m"], [8, ""], [7, ""]] },
    { tonality: "minor", roman: "i – ♭VII – ♭VI – V", chords: [[0, "m"], [10, ""], [8, ""], [7, ""]] },
    { tonality: "minor", roman: "i – iv", chords: [[0, "m"], [5, "m"]] },
    { tonality: "minor", roman: "i7 – IV7", chords: [[0, "m7"], [5, "7"]] },
    { tonality: "minor", roman: "i9 – ♭VImaj7", chords: [[0, "m9"], [8, "maj7"]] },
    { tonality: "minor", roman: "i – v – ♭VI", chords: [[0, "m"], [7, "m"], [8, ""]] },
    { tonality: "major", roman: "IVmaj7 – iii7 – vi9", chords: [[5, "maj7"], [4, "m7"], [9, "m9"]] },
    { tonality: "major", roman: "I – ♭VII", chords: [[0, ""], [10, ""]] },
  ];

  const name = (pc, tonic, tonality) => (SHARP_KEYS[tonality].has(tonic) ? SHARP : FLAT)[((pc % 12) + 12) % 12];

  function harmony(r, pick, avoidKeys = []) {
    // Minor about 85% of the time.
    const pool = LOOPS.filter((l) => (r() < 0.85 ? l.tonality === "minor" : l.tonality === "major"));
    const loop = pick(pool.length ? pool : LOOPS, r);
    const keys = loop.tonality === "minor" ? MINOR_KEYS : MAJOR_KEYS;
    let tonic = pick(keys, r);
    for (let i = 0; i < 8 && avoidKeys.includes(`${tonic} ${loop.tonality}`); i++) tonic = pick(keys, r);
    const chords = loop.chords.map(([o, q]) => name(PC[tonic] + o, tonic, loop.tonality) + q);
    return { key: `${tonic} ${loop.tonality}`, roman: loop.roman, chords };
  }

  return { harmony };
})();

<script>
/* ONE OF ONE — one engine. Builds every sound from grammar slots, resolves
 * clashes, and lays the result out in Suno's own field order. */
"use strict";

const OneEngine = (() => {
  const G = typeof OneGrammar !== "undefined" ? OneGrammar : require("./grammar.js");
  const T = typeof OneTheory !== "undefined" ? OneTheory : require("./theory.js");
  const Guard = typeof OneGuard !== "undefined" ? OneGuard : require("./guard.js");

  function mulberry32(a) {
    return () => {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (arr, r) => arr[Math.floor(r() * arr.length)];
  // Pick from the entries that pass every rule; fall back to the whole list.
  const pickWhere = (arr, r, ok) => {
    const pool = arr.filter(ok);
    return pick(pool.length ? pool : arr, r);
  };
  const int = (lo, hi, r) => lo + Math.floor(r() * (hi - lo + 1));

  const TEMPO = [
    [72, 82],
    [86, 98],
    [132, 148],
    [150, 162],
  ];

  const EXCLUDE = [
    "vocals", "singing", "rap", "choir", "humming", "background vocals", "vocal chops", "chanting",
    "DJ scratching", "riser", "EDM drop", "drum fills", "film score", "cinematic", "orchestral strings", "lo-fi",
  ].join(", ");

  const weighted = (entries, r) => {
    const total = entries.reduce((n, [, w]) => n + w, 0);
    let x = r() * total;
    for (const [v, w] of entries) if ((x -= w) < 0) return v;
    return entries[entries.length - 1][0];
  };
  // "a drunken Hammond organ ...|the drunken organ" -> [full, handle]
  const split = (entry) => entry.split("|");

  function buildLead(r, lane) {
    const L = G.LEAD;
    const family = weighted(Object.entries(lane.families), r);
    const F = G.FAMILIES[family];
    const [source, handle] = split(pick(F.sources, r));
    const register = pickWhere(L.register, r, () => true);
    const low = /low register|doubling the 808|under the snare/.test(register);
    const motif = pick(L.motif, r);
    const long = /five|six|seven|run/.test(motif);
    const articulation = pickWhere(L.articulation, r, (a) => !(long && /one held|one anticipated|a push note|two stabs|three-note pickup/.test(a)));
    const legato = /legato|long tones|held note/.test(articulation);
    const placement = pick(L.placement, r);
    const dry = /dry|narrow|mono/.test(placement);
    const character = pickWhere(F.character, r, (c) =>
      !(dry && /chorus|detuned/.test(c)) &&
      !(legato && /gated/.test(c)) &&
      !(low && /band-passed/.test(c)) &&
      !(/detuned/.test(source) && /detuned|chorus|ring-mod/.test(c)));
    const motion = pickWhere(L.motion, r, (m) =>
      !(dry && /delay feedback|detune widens/.test(m)) &&
      !(legato && /shorter/.test(m)) &&
      !(/bitcrush/.test(m) && /low-passed/.test(character)));
    return {
      family, handle, frame: F.frame, source, character, register, articulation, placement, motion,
      motif,
      human: pick(L.human, r),
      low, dry,
      triplet: /triplet|three-against/.test(articulation),
      is808: /^an 808/.test(source),
    };
  }

  function buildBass(r, lead, lane) {
    const B = G.BASS;
    // A lane's own basses (the South Side tuba) come up about half the time.
    const fits = (s) => !(lead.low && /fingered|saw basses|tuba|sousaphone/.test(s)) && !(/tuba|sousaphone/.test(s) && /tuba|sousaphone/.test(lead.source));
    const laneFits = lane.bass.filter(fits);
    const pool = laneFits.length && r() < 0.5 ? laneFits : B.source;
    const source = lead.is808
      ? pick(["a clean sine sub", "a sub that only sustains on the root"], r)
      : pickWhere(pool, r, fits);
    const pattern = pickWhere(B.pattern, r, (p) =>
      !(lead.low && /motif|moving when/.test(p)) &&
      !(lead.triplet && /triplet/.test(p)) &&
      !(lead.is808 && !/one note|silent|three notes|root/.test(p)));
    return { source, tone: pick(B.tone, r), pattern, human: pick(B.human, r) };
  }

  function buildCounter(r, lead, lane) {
    // South Side keeps brass in the record: a non-brass lead gets a brass counter.
    const others = lane.id === "southside" && lead.family !== "brass"
      ? [["brass", 1]]
      : Object.entries(lane.families).filter(([f]) => f !== lead.family);
    const family = others.length ? weighted(others, r) : pick(Object.keys(G.FAMILIES).filter((f) => f !== lead.family), r);
    const F = G.FAMILIES[family];
    const [source, handle] = split(pickWhere(F.sources, r, (x) => !/808/.test(x)));
    return { family, source, handle, character: pick(F.character, r), role: pick(G.COUNTER_ROLE, r) };
  }

  function buildDrums(r, lead) {
    const D = G.DRUMS;
    const hats = pickWhere(D.hats, r, (h) => !(lead.triplet && /threes/.test(h)));
    const twitch = {
      sound: pick(G.TWITCH.sound, r),
      rhythm: pickWhere(G.TWITCH.rhythm, r, (x) => !(lead.triplet && /threes|triple/.test(x))),
      where: pick(G.TWITCH.where, r),
    };
    const triplet = lead.triplet
      ? "a heavy bounce, triplets felt but not played"
      : pickWhere(G.GROOVE.triplet, r, (t) => !(/threes/.test(hats) && /hats/.test(t)));
    return {
      color: pick(G.COLOR, r),
      kick: pick(D.kick, r),
      snare: pick(D.snare, r),
      hats,
      twitch,
      sync: pick(G.GROOVE.sync, r),
      feel: pick(G.GROOVE.human, r),
      triplet,
    };
  }

  function buildSwitch(r, lead, bass, drums) {
    const S = G.SWITCH;
    const when = pick(S.when, r);
    const what = pickWhere(S.what, r, (w) =>
      !(/only the twitch/.test(w) && /after the switch/.test(drums.twitch.where)) &&
      !(/go dry and the lead goes huge/.test(w) && !lead.dry) &&
      !(/swaps from 808/.test(w) && !/808/.test(bass.source)) &&
      !(/rolling in threes/.test(w) && /threes/.test(drums.hats)) &&
      !(/half-time/.test(w) && /half-time/.test(drums.snare)));
    const sparse = /only the twitch|strips to 808/.test(what);
    const land = pickWhere(S.land, r, (l) =>
      !(/new key/.test(l) && !/key/.test(what)) &&
      !(sparse && /new drums|drums join|everything slams/.test(l)) &&
      !(/silence/.test(l) && /silence|full-stop/.test(when)));
    return { when, what, land };
  }

  function style(p) {
    const { lead, bass, drums } = p;
    const head = `${p.anchor}, ${p.bpm} BPM, ${p.key}`;
    const leadLine = `lead: ${lead.source}, ${lead.frame}, ${lead.character}, ${lead.register}, playing ${lead.motif} as ${lead.articulation}, ${lead.human}, ${lead.placement}`;
    const counterLine = `counter: ${p.counter.source}, ${p.counter.character}, ${p.counter.role}`;
    const bassLine = `bass: ${bass.source}, ${bass.tone}, ${bass.human}`;
    const drumLine = `drums: ${drums.kick}, ${drums.snare}, ${drums.hats}, ${drums.color}`;
    const twitchLine = `twitch percussion: ${drums.twitch.sound} ${drums.twitch.rhythm}`;
    const grooveLine = `${drums.sync}, ${drums.feel}`;
    const tail = `${G.MIX}, instrumental`;
    // The lead gets every slot, up front; the extras go first when the field runs long.
    // The groove line also lives in the lyrics tags, so it is the first thing cut.
    const tries = [
      [head, leadLine, counterLine, bassLine, drumLine, twitchLine, grooveLine, tail],
      [head, leadLine, counterLine, bassLine, drumLine, twitchLine, tail],
      [head, leadLine, counterLine, bassLine, drumLine, tail], // twitch then rides in the lyrics tags
      [head, leadLine, `counter: ${p.counter.source}, ${p.counter.role}`, bassLine, drumLine, tail],
    ];
    let s;
    for (const t of tries) if ((s = t.join(". ") + ".").length <= 1000) break;
    return s;
  }

  function lyrics(p, r) {
    const { lead, drums, sw } = p;
    const h = lead.handle;
    const c = p.counter;
    const late = /after the switch/.test(drums.twitch.where);
    const twitch = p.styleHasTwitch
      ? `twitch percussion ${drums.twitch.where}`
      : `twitch percussion: ${drums.twitch.sound} ${drums.twitch.rhythm}, ${drums.twitch.where}`;
    const sections = [
      `[Intro | ${h} alone, ${lead.placement.split(",")[0]}]`,
      `[Verse | ${drums.kick.replace(/^an? /, "")}, ${drums.hats.replace(/^an? /, "")}, ${/808/.test(p.bass.source) ? "808" : "bass"} ${p.bass.pattern}, ${drums.sync}, ${late ? "drums only" : twitch}]`,
      `[Hook | full beat, ${h} up front, ${lead.motion}${/after the switch/.test(c.role) ? "" : `, ${c.handle} ${c.role}`}]`,
    ];
    const shape = int(0, 2, r);
    if (shape >= 1) sections.push(`[Verse 2 | ${drums.triplet}, ${h} thinner]`);
    if (shape === 2) sections.push(`[Break | drums cut, ${h} and 808 only]`);
    sections.push(`[Beat Switch | ${sw.when}, ${sw.what}, ${sw.land}]`);
    const after = [];
    if (/after the switch/.test(c.role)) after.push(`${c.handle} enters`);
    if (late) after.push(p.styleHasTwitch ? "twitch percussion enters" : `twitch percussion enters: ${drums.twitch.sound} ${drums.twitch.rhythm}`);
    if (!after.length) after.push(drums.sync);
    sections.push(`[Hook | after the switch, ${h} returns, ${after.join(", ")}]`);
    sections.push(`[Outro | ${h} alone, ends dry on beat 1]`);
    sections.push("[End]");
    return sections.join("\n\n");
  }

  function generate({ seed = 1, avoidKeys = [] } = {}) {
    const r = mulberry32(seed >>> 0);
    const harmony = T.harmony(r, pick, avoidKeys);
    const [lo, hi] = pick(TEMPO, r);
    const lane = weighted(G.LANES.map((l) => [l, l.weight]), r);
    const lead = buildLead(r, lane);
    const counter = buildCounter(r, lead, lane);
    const bass = buildBass(r, lead, lane);
    const drums = buildDrums(r, lead);
    const sw = buildSwitch(r, lead, bass, drums);
    const p = {
      anchor: pick(lane.anchors, r),
      counter,
      bpm: int(lo, hi, r),
      key: `in ${harmony.key}`,
      lead, bass, drums, sw,
    };
    const styleText = style(p);
    p.styleHasTwitch = styleText.includes("twitch percussion:");
    const lyricsText = lyrics(p, r);
    const warnings = Guard.check(`${styleText}\n${lyricsText}`).map((h) => ({ ...h, message: `${h.rule}: "${h.word}" ${h.why}` }));
    const weirdness = int(55, 65, r);
    const styleInfluence = int(65, 75, r);
    const model = r() < 0.5 ? "v6-wild" : "v6";
    return {
      style: styleText,
      lyrics: lyricsText,
      exclude: EXCLUDE,
      sliders: { weirdness, styleInfluence },
      settings: { model, variety: "Off", maxMode: "On" },
      meta: { lane: lane.label, seed: seed >>> 0, title: `${pick(G.TITLE.a, r)} ${pick(G.TITLE.b, r)}`, bpm: p.bpm, key: harmony.key },
      fingerprint: [counter.source, lead.source, lead.character, lead.motif, lead.articulation, lead.human, sw.what, harmony.key].join("|"),
      parts: { lead, counter, bass, drums, switch: sw },
      warnings,
    };
  }

  return { generate, EXCLUDE };
})();

<script>
/* ONE OF ONE — the page. One button; the four Suno fields in Suno's order. */
"use strict";
(() => {
  const E = OneEngine;
  const $ = (id) => document.getElementById(id);
  const STORE = "oneofone.seen.v1";
  let pkg;

  let seen = new Set();
  try {
    seen = new Set(JSON.parse(localStorage.getItem(STORE) || "[]"));
  } catch {
    seen = new Set();
  }
  const remember = (fp) => {
    seen.add(fp);
    try {
      localStorage.setItem(STORE, JSON.stringify([...seen].slice(-5000)));
    } catch {
      /* storage blocked: the in-memory set still prevents repeats this visit */
    }
  };
  const recentKeys = [];

  function roll() {
    for (let i = 0; i < 40; i++) {
      pkg = E.generate({ seed: Math.floor(Math.random() * 4294967295), avoidKeys: recentKeys });
      if (!seen.has(pkg.fingerprint)) break;
    }
    remember(pkg.fingerprint);
    recentKeys.push(pkg.meta.key);
    if (recentKeys.length > 4) recentKeys.shift();
    render();
  }

  function slider(name, value) {
    const row = document.createElement("div");
    row.className = "slider";
    const label = document.createElement("span");
    label.textContent = name;
    const track = document.createElement("span");
    track.className = "track";
    const fill = document.createElement("span");
    fill.className = "fill";
    fill.style.width = `${value}%`;
    const knob = document.createElement("span");
    knob.className = "knob";
    knob.style.left = `${value}%`;
    track.append(fill, knob);
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = `${value}%`;
    row.append(label, track, val);
    return row;
  }
  function chip(label, value) {
    const c = document.createElement("span");
    c.className = "chip";
    const b = document.createElement("b");
    b.textContent = value;
    c.append(`${label} `, b);
    return c;
  }

  function render() {
    $("roll-id").textContent = `#${pkg.meta.seed.toString(36).toUpperCase()}`;
    const vibe = $("vibe");
    vibe.textContent = "";
    const em = document.createElement("em");
    em.textContent = pkg.meta.title;
    vibe.append(em, ` · ${pkg.meta.lane} · ${pkg.meta.bpm} BPM · ${pkg.meta.key}`);
    $("lyrics").textContent = pkg.lyrics;
    $("lyrics-count").textContent = `${pkg.lyrics.length}/5000`;
    $("style").textContent = pkg.style;
    $("style-count").textContent = `${pkg.style.length}/1000`;
    $("exclude").textContent = pkg.exclude;
    const sl = $("sliders");
    sl.textContent = "";
    for (const [name, v] of [["Weirdness", pkg.sliders.weirdness], ["Style Influence", pkg.sliders.styleInfluence]]) sl.appendChild(slider(name, v));
    const chips = $("chips");
    chips.textContent = "";
    chips.append(chip("Model", pkg.settings.model), chip("Variety", pkg.settings.variety), chip("Max Mode", pkg.settings.maxMode), chip("Instrumental", "On"));
  }

  for (const btn of document.querySelectorAll(".copy[data-copy]")) {
    btn.onclick = async () => {
      const text = pkg[btn.dataset.copy];
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      btn.textContent = "Copied";
      btn.classList.add("done");
      setTimeout(() => {
        btn.textContent = "Copy";
        btn.classList.remove("done");
      }, 1200);
    };
  }

  $("roll").onclick = roll;
  roll();
})();

</script>
