<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cipher — Home Situational Awareness</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root {
    --bg:#0b0e14; --panel:#141922; --panel2:#1c2230; --line:#252c3a;
    --text:#e6ebf2; --muted:#8b95a7; --accent:#4da3ff; --ok:#3ecf8e;
    --warn:#f5b14c; --bad:#f96a6a; --live:#ff4d5e;
    --radius:14px; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); }
  header {
    display:flex; align-items:center; gap:16px; padding:14px 20px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(11,14,20,.9);
    backdrop-filter:blur(8px); z-index:10;
  }
  header h1 { font-size:16px; letter-spacing:.5px; margin:0; font-weight:650; }
  header h1 .dot { color:var(--accent); }
  .spacer { flex:1; }
  .status { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .status .pip { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .status.ready .pip { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .status.down .pip { background:var(--bad); box-shadow:0 0 8px var(--bad); }
  button {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:7px 12px; border-radius:9px; font-size:12.5px; cursor:pointer; font-weight:550;
  }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .grid {
    display:grid; gap:16px; padding:20px;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .feed { position:relative; aspect-ratio:16/9; background:#05070b; overflow:hidden; }
  .feed img, .feed video { width:100%; height:100%; object-fit:cover; display:block; }
  .feed .overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; text-align:center; padding:16px; pointer-events:none;
  }
  .badge {
    position:absolute; top:10px; left:10px; font-size:10.5px; font-weight:700; letter-spacing:.6px;
    padding:3px 8px; border-radius:20px; background:rgba(0,0,0,.55); color:var(--muted);
  }
  .badge.live { background:var(--live); color:#fff; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  .ts { position:absolute; bottom:8px; right:10px; font-size:10.5px; color:#c7cfdd;
        background:rgba(0,0,0,.5); padding:2px 7px; border-radius:6px; font-variant-numeric:tabular-nums; }
  .meta { padding:11px 14px; display:flex; flex-direction:column; gap:9px; }
  .row { display:flex; align-items:center; gap:8px; }
  .name { font-weight:650; font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; color:var(--muted); background:var(--panel2); border:1px solid var(--line);
          padding:2px 8px; border-radius:20px; }
  .chip.ok{color:var(--ok);} .chip.warn{color:var(--warn);} .chip.bad{color:var(--bad);}
  .actions { display:flex; gap:8px; margin-top:2px; }
  .actions button { flex:1; }
  button.live-btn.active { background:var(--live); border-color:var(--live); color:#fff; }
  .empty { padding:60px 20px; text-align:center; color:var(--muted); }
  .empty code { background:var(--panel2); padding:2px 7px; border-radius:6px; color:var(--accent); }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span class="dot">◈</span> CIPHER</h1>
  <div id="status" class="status"><span class="pip"></span><span id="statusText">connecting…</span></div>
  <div class="spacer"></div>
  <label class="status"><input type="checkbox" id="autoLive" /> stop live when tab hidden</label>
  <button id="refreshBtn">↻ Refresh all</button>
</header>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none"></div>

<script>
const SNAPSHOT_INTERVAL_MS = 15000;   // dashboard snapshot refresh cadence
const state = { cameras: [], live: {} };

async function j(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (_) {}
    throw new Error(msg);
  }
  return r.json();
}

function chip(label, cls) { return `<span class="chip ${cls||''}">${label}</span>`; }

function batteryChip(c) {
  if (c.battery == null && c.battery_level == null) return '';
  const lvl = c.battery_level;
  const cls = (c.battery === 'low') ? 'bad' : (lvl != null && lvl <= 2 ? 'warn' : 'ok');
  const txt = lvl != null ? `🔋 ${lvl}/3` : `🔋 ${c.battery}`;
  return chip(txt, cls);
}
function wifiChip(c){ return c.wifi_strength!=null ? chip(`📶 ${c.wifi_strength}`,'') : ''; }
function tempChip(c){ return c.temperature!=null ? chip(`🌡 ${c.temperature}°`,'') : ''; }
function motionChip(c){ return c.motion_detected ? chip('● MOTION','bad') : ''; }

function cardHTML(c) {
  const id = encodeURIComponent(c.name);
  return `
  <div class="card" data-name="${c.name}">
    <div class="feed" id="feed-${id}">
      <span class="badge" id="badge-${id}">SNAPSHOT</span>
      <img id="img-${id}" alt="${c.name}" />
      <div class="ts" id="ts-${id}"></div>
      <div class="overlay" id="ov-${id}"></div>
    </div>
    <div class="meta">
      <div class="row"><span class="name">${c.name}</span>
        <span class="chip">${c.type||'camera'}</span></div>
      <div class="chips">${batteryChip(c)}${wifiChip(c)}${tempChip(c)}${motionChip(c)}</div>
      <div class="actions">
        <button onclick="freshSnap('${c.name}')">📷 Fresh</button>
        <button class="live-btn" id="livebtn-${id}" onclick="toggleLive('${c.name}')">▶ Go Live</button>
      </div>
    </div>
  </div>`;
}

function refreshSnapshot(name, fresh=false) {
  const id = encodeURIComponent(name);
  if (state.live[name]) return;                    // don't clobber a live feed
  const img = document.getElementById('img-'+id);
  if (!img) return;
  const url = `/api/cameras/${id}/snapshot.jpg?fresh=${fresh?1:0}&t=${Date.now()}`;
  const probe = new Image();
  probe.onload = () => {
    img.src = probe.src;
    document.getElementById('ts-'+id).textContent = new Date().toLocaleTimeString();
    document.getElementById('ov-'+id).textContent = '';
  };
  probe.onerror = () => { document.getElementById('ov-'+id).textContent = 'snapshot unavailable'; };
  probe.src = url;
}

function freshSnap(name){ document.getElementById('ov-'+encodeURIComponent(name)).textContent='capturing…'; refreshSnapshot(name,true); }

async function toggleLive(name) {
  if (state.live[name]) { await stopLive(name); return; }
  const id = encodeURIComponent(name);
  const btn = document.getElementById('livebtn-'+id);
  const ov = document.getElementById('ov-'+id);
  btn.disabled = true; btn.textContent = '⏳ starting'; ov.textContent = 'connecting to camera…';
  try {
    const res = await j(`/api/cameras/${id}/live/start`, {method:'POST'});
    await startPlayback(name, res.stream_id, res.playlist_url);
  } catch (e) {
    ov.textContent = 'live failed: ' + e.message;
    btn.disabled = false; btn.textContent = '▶ Go Live';
  }
}

async function startPlayback(name, streamId, playlistUrl) {
  const id = encodeURIComponent(name);
  const feed = document.getElementById('feed-'+id);
  const img = document.getElementById('img-'+id);
  const btn = document.getElementById('livebtn-'+id);
  const badge = document.getElementById('badge-'+id);
  const ov = document.getElementById('ov-'+id);

  const video = document.createElement('video');
  video.autoplay = true; video.muted = true; video.playsInline = true; video.controls = false;
  img.style.display = 'none'; feed.insertBefore(video, ov);

  let hls = null;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode:true, liveSyncDurationCount:2, maxBufferLength:6 });
    hls.loadSource(playlistUrl); hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) ov.textContent = 'stream error'; });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = playlistUrl;                        // Safari native HLS
  } else { ov.textContent = 'HLS not supported in this browser'; }

  state.live[name] = { streamId, video, hls };
  badge.textContent = 'LIVE'; badge.classList.add('live');
  btn.disabled = false; btn.textContent = '■ Stop'; btn.classList.add('active');
  ov.textContent = ''; video.play().catch(()=>{});
}

async function stopLive(name) {
  const s = state.live[name]; if (!s) return;
  const id = encodeURIComponent(name);
  try { if (s.hls) s.hls.destroy(); } catch(_){}
  try { s.video.remove(); } catch(_){}
  delete state.live[name];
  document.getElementById('img-'+id).style.display = '';
  const badge = document.getElementById('badge-'+id);
  badge.textContent = 'SNAPSHOT'; badge.classList.remove('live');
  const btn = document.getElementById('livebtn-'+id);
  btn.textContent = '▶ Go Live'; btn.classList.remove('active');
  try { await fetch(`/api/live/${s.streamId}/stop`, {method:'POST'}); } catch(_){}
  refreshSnapshot(name);
}

function setStatus(cls, text){
  const el = document.getElementById('status');
  el.className = 'status ' + cls;
  document.getElementById('statusText').textContent = text;
}

async function load() {
  try {
    const h = await j('/api/health');
    if (!h.ready) {
      setStatus('down','not authenticated');
      document.getElementById('grid').style.display='none';
      const empty = document.getElementById('empty');
      empty.style.display='block';
      empty.innerHTML = `<h2>Not connected to Blink</h2>
        <p>${h.hint || 'Run the authentication step, then restart the server.'}</p>
        <p>On the host machine:&nbsp; <code>python authenticate.py</code></p>`;
      return;
    }
    const data = await j('/api/cameras');
    state.cameras = data.cameras;
    setStatus('ready', `${state.cameras.length} camera${state.cameras.length===1?'':'s'} online`);
    const grid = document.getElementById('grid');
    grid.innerHTML = state.cameras.map(cardHTML).join('');
    state.cameras.forEach(c => refreshSnapshot(c.name));
  } catch (e) {
    setStatus('down', 'error: ' + e.message);
  }
}

document.getElementById('refreshBtn').onclick = async () => {
  try { await j('/api/refresh', {method:'POST'}); } catch(_){}
  state.cameras.forEach(c => refreshSnapshot(c.name));
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden && document.getElementById('autoLive').checked) {
    Object.keys(state.live).forEach(stopLive);
  }
});

setInterval(() => state.cameras.forEach(c => refreshSnapshot(c.name)), SNAPSHOT_INTERVAL_MS);
load();
</script>
</body>
</html>
